# Publishes to npm when a GitHub release is published. The release tag must be v<package.json version>
# (a prerelease version such as 1.0.0-beta.1 is published under the `next` dist-tag).
#
# One-time setup on npmjs.com: package settings → Trusted publishing → GitHub Actions, repository
# sidorares/node-rfb2, workflow release.yml, environment npm. No token is needed then; until it is set
# up, an NPM_TOKEN repository secret (an automation token) works too.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
